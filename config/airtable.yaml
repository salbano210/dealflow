# Airtable sync configuration.
# Set your AIRTABLE_API_KEY and AIRTABLE_BASE_ID in .env

base_id: ""          # e.g. "appXXXXXXXXXXXXXX" (from Airtable API docs)
table_name: "Table 1"

# Which fields to push to Airtable. Order matters (first is the primary field).
# Format: airtable_field_name: source
#   source can be:
#     "company.<attr>"     — direct company column (name, website, status, source)
#     "kpi.<kpi_key>"      — extracted KPI value
#     "kpi_state.<kpi_key>" — KPI state (known/inferred/unknown)
#     "computed.<name>"    — computed field (e.g. data_completeness)
fields:
  Name: company.name
  Website: company.website
  Status: company.status
  Source: company.source
  Business Model: kpi.business_model
  Revenue: kpi.estimated_revenue_usd
  Growth Rate: kpi.growth_rate_yoy
  Founder Led: kpi.founder_led
  Geography: kpi.geography
  Market Category: kpi.market_category
  Target Customer: kpi.target_customer
  Employee Count: kpi.employee_count
  Data Completeness: computed.data_completeness

# Fields that humans can edit in Airtable (pulled back to DB).
# Everything else is read-only (AI-owned).
human_editable_fields:
  - Status
  - Source
