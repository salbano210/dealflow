# Investment thesis definition.
# Editable. Bump `version` whenever you change substantive criteria --
# every screening records which thesis version scored it.

name: "Lower Middle Market Founder-Led"
version: 2

# Hard filters: pure Python, no LLM. Instant reject if violated.
hard_filters:
  min_revenue_usd: 5_000_000
  max_revenue_usd: 50_000_000
  founder_led_required: true

# Soft criteria: injected into the screening prompt for LLM-judged dimensions.
soft_criteria:
  preferred_markets:
    - business_services
    - healthcare_services
    - industrial_services
    - consumer_services
    - niche_manufacturing
    - distribution

# Free-text guidance the LLM sees verbatim in its system prompt.
notes: |
  We invest in founder-led, lower-middle-market services businesses.
  We want companies that are profitable or near-profitable, not burning cash.
  We prefer low employee counts (capital-efficient operations).
  Customer retention is critical — recurring revenue or sticky relationships.

  Revenue range: $5M - $50M (hard filter)
  Founder-led: required (hard filter)

  Financial control matters: we want EBITDA positive or near-positive.
  Customer retention matters: high switching costs, long relationships.

  Avoid: venture-scale burn, high customer churn, non-founder-led.

# Cost guardrail: if a single company's pipeline run exceeds this in LLM
# spend (summed across all steps), the pipeline halts and logs a warning.
max_cost_per_company_usd: 0.10
