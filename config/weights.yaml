# Scoring dimensions.
#
# Each dimension has:
#   key      -- machine name
#   weight   -- fraction of total score (all weights must sum to 1.0)
#   scorer   -- 'llm' (LLM-judged via rubric) or 'builtin.<name>' (deterministic)
#   inputs   -- KPI keys this dimension consumes (must exist in kpis.yaml)
#   rubric   -- for llm scorers: instructions the model follows
#   config   -- for builtin scorers: scorer-specific parameters
#
# Total score is normalized to 0-100 regardless of weight values.
# Adding a new dimension: just append here.

dimensions:
  - key: founder_led
    weight: 0.25
    scorer: llm
    inputs: [founder_led, founder_ownership_pct]
    rubric: |
      Founder-led is heavily weighted. Score 0-100:
      - 100 if founder is CEO/President AND estimated ownership >20%
      - 80 if founder is CEO/President but ownership unknown or <20%
      - 50 if founder is active but not CEO (board, advisor, etc.)
      - 0 if no founder involvement (professional management only)

  - key: customer_retention
    weight: 0.20
    scorer: llm
    inputs: [customer_concentration, recurring_revenue_share, net_revenue_retention]
    rubric: |
      Score 0-100 based on evidence of customer stickiness:
      - High retention (contracts, recurring revenue, low churn): 80-100
      - Moderate retention (repeat customers, some switching costs): 50-79
      - Low retention (transactional, high churn, no evidence): 0-49
      If customer concentration is >30%, cap at 70 (concentration risk).
      If no retention data, score 30 and flag as missing.

  - key: financial_control
    weight: 0.15
    scorer: llm
    inputs: [gross_margin, growth_rate_yoy, estimated_revenue_usd]
    rubric: |
      Score 0-100 for financial discipline:
      - EBITDA positive or clearly profitable: 80-100
      - Near breakeven, path to profitability clear: 50-79
      - Burning cash with unclear path: 0-49
      - High gross margin (>50%) is a positive signal.
      - Growth funded by profits (not VC) scores higher.

  - key: growth_rate
    weight: 0.12
    scorer: llm
    inputs: [growth_rate_yoy]
    rubric: |
      Score 0-100 based on YoY revenue growth:
      >20%  = 100 (strong organic growth)
      15-20% = 80
      10-15% = 60
      5-10%  = 40
      0-5%   = 20
      <0%    = 0 (declining revenue)
      unknown = 30 (insufficient data, slight negative)

  - key: market_category
    weight: 0.10
    scorer: llm
    inputs: [market_category, target_customer, business_model]
    rubric: |
      Score 0-100 for market attractiveness:
      - Preferred markets (business services, healthcare services, industrial,
        consumer services, niche manufacturing, distribution): 70-100
      - Adjacent or niche markets with defensibility: 40-69
      - Crowded, commoditized, or venture-scale markets: 0-39
      - B2B preferred over B2C. Services preferred over products.

  - key: employee_count
    weight: 0.08
    scorer: builtin.threshold
    inputs: [employee_count]
    config:
      field: employee_count
      min: 10
      target: 500
      invert: true  # lower is better

  - key: revenue_scale
    weight: 0.05
    scorer: builtin.threshold
    inputs: [estimated_revenue_usd]
    config:
      field: estimated_revenue_usd
      min: 5_000_000
      target: 50_000_000

  - key: data_completeness
    weight: 0.05
    scorer: builtin.completeness
    inputs: []
    config:
      required_only: true
      count_inferred_as_half: true
